name: Windows Desktop Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: windows-desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build WPF solution
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/Directory.Packages.props
            **/*.csproj

      - name: Show .NET information
        shell: pwsh
        run: dotnet --info

      - name: Restore solution
        shell: pwsh
        run: dotnet restore .\AIWordPressManager.sln --disable-parallel

      - name: Build solution
        shell: pwsh
        run: dotnet build .\AIWordPressManager.sln --configuration Release --no-restore --maxcpucount:1 /p:ContinuousIntegrationBuild=true

      - name: Publish desktop application
        shell: pwsh
        run: dotnet publish .\src\AIWordPressManager.Desktop\AIWordPressManager.Desktop.csproj --configuration Release --no-restore --maxcpucount:1 --output .\artifacts\AIWordPressManager-Desktop /p:ContinuousIntegrationBuild=true

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: AIWordPressManager-Desktop-v1.3.9-${{ github.run_number }}
          path: .\artifacts\AIWordPressManager-Desktop\
          if-no-files-found: error
          retention-days: 14
