name: Windows Desktop Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WPF solution
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/Directory.Packages.props
            **/*.csproj

      - name: Show .NET information
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore .\AIWordPressManager.sln

      - name: Build solution
        run: dotnet build .\AIWordPressManager.sln --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Publish desktop application
        run: dotnet publish .\src\AIWordPressManager.Desktop\AIWordPressManager.Desktop.csproj --configuration Release --no-restore --output .\artifacts\AIWordPressManager-Desktop /p:ContinuousIntegrationBuild=true

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        with:
          name: AIWordPressManager-Desktop-v1.3.9
          path: .\artifacts\AIWordPressManager-Desktop\
          if-no-files-found: error
          retention-days: 14
