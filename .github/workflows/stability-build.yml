name: Stability Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows .NET 8 Build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Display SDK information
        shell: pwsh
        run: dotnet --info

      - name: Validate dashboard journey contracts
        shell: pwsh
        run: .\Build\Validate-DashboardJourneyState.ps1

      - name: Validate first user journey sidebar
        shell: pwsh
        run: .\Build\Validate-FirstUserJourneySidebar.ps1

      - name: Validate Sites first journey
        shell: pwsh
        run: .\Build\Validate-SitesFirstJourney.ps1

      - name: Validate WordPress Explorer first journey
        shell: pwsh
        run: .\Build\Validate-ExplorerFirstJourney.ps1

      - name: Validate SEO Audit first journey
        shell: pwsh
        run: .\Build\Validate-SeoAuditFirstJourney.ps1

      - name: Validate Suggested Changes first journey
        shell: pwsh
        run: .\Build\Validate-SuggestedChangesFirstJourney.ps1

      - name: Validate Approval Queue first journey
        shell: pwsh
        run: .\Build\Validate-ApprovalQueueFirstJourney.ps1

      - name: Validate Execution Center first journey
        shell: pwsh
        run: .\Build\Validate-ExecutionCenterFirstJourney.ps1

      - name: Validate Evidence Center first journey
        shell: pwsh
        run: .\Build\Validate-EvidenceCenterFirstJourney.ps1

      - name: Validate completed first journey summary
        shell: pwsh
        run: .\Build\Validate-FirstJourneyCompletion.ps1

      - name: Validate unified current-site context
        shell: pwsh
        run: .\Build\Validate-CurrentSiteContext.ps1

      - name: Validate guided tour workflow
        shell: pwsh
        run: .\Build\Validate-GuidedTour.ps1

      - name: Validate site-bound execution workflow
        shell: pwsh
        run: .\Build\Validate-SiteOperationGuard.ps1

      - name: Validate execution receipts and audit trail
        shell: pwsh
        run: .\Build\Validate-ExecutionReceipts.ps1

      - name: Validate support bundle redaction
        shell: pwsh
        run: .\Build\Validate-SupportBundleSecurity.ps1

      - name: Validate support bundle build compatibility
        shell: pwsh
        run: .\Build\Validate-SupportBundleCompatibility.ps1

      - name: Validate Help support diagnostics panel
        shell: pwsh
        run: .\Build\Validate-HelpSupportPanel.ps1

      - name: Validate unified failure recovery experience
        shell: pwsh
        run: .\Build\Validate-FailureRecoveryExperience.ps1

      - name: Validate Windows acceptance evidence
        shell: pwsh
        run: .\Build\Validate-WindowsAcceptance.ps1

      - name: Restore
        shell: pwsh
        run: dotnet restore .\AIWordPressManager.sln --force --nologo

      - name: Build solution
        shell: pwsh
        run: dotnet build .\AIWordPressManager.sln -c Debug --no-restore --nologo -p:ContinuousIntegrationBuild=true

      - name: Test non-WPF projects
        shell: pwsh
        run: dotnet test .\AIWordPressManager.sln -c Debug --no-build --nologo --filter "FullyQualifiedName!~UI" --logger "trx;LogFileName=stability-tests.trx"

      - name: Generate Windows acceptance evidence
        shell: pwsh
        run: .\Build\Invoke-WindowsAcceptance.ps1 -Configuration Debug -ObservationSeconds 20 -OutputDirectory AcceptanceResults -SourceBranch "${{ github.head_ref || github.ref_name }}" -SourceCommit "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Upload Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-results-${{ github.run_number }}
          path: AcceptanceResults
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 7
